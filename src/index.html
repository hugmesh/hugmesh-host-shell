<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="title" content="HugMesh" />
    <meta
      name="description"
      content="HugMesh — a self-hosted, federated social platform: secure Matrix chat, a Mastodon fediverse timeline, forums, wiki, video and live streaming, all under one account."
    />
    <meta
      name="keywords"
      content="HugMesh, federated platform, self-hosted, fediverse, Matrix, Mastodon, forum, wiki, community"
    />
    <meta name="robots" content="index, follow, max-snippet:-1, max-video-preview:-1, max-image-preview:large" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="30 days" />
    <meta name="author" content="HugMesh" />
    <meta name="generator" content="Angular 22" />
    <!-- Host shell chrome color = the near-black host backdrop ($black #0a0a0a). -->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Social / Open Graph card (favicon.ico is the fleet's only real brand
         mark — a text wordmark otherwise; see docs/BRANDING.md). -->
    <meta property="og:title" content="HugMesh" />
    <meta
      property="og:description"
      content="A self-hosted, federated social platform: secure Matrix chat, a Mastodon fediverse timeline, forums, wiki, video and live streaming, all under one account."
    />
    <meta property="og:image" content="https://hugmesh.systems/favicon.ico" />
    <meta property="og:url" content="https://hugmesh.systems" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <link
      rel="preload"
      href="assets/MoreSugar-Thin.ttf"
      as="font"
      type="font/truetype"
      crossorigin="anonymous"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="favicon.ico" />
    <title>HugMesh</title>
    <!-- Runtime shell THEME, written at container start by
         docker-entrypoint.d/50-snap-theme.sh from SNAP_THEME_CSS (same mechanism
         as hugmesh-login-ui). It carries ALREADY-DERIVED "double-s-d" token text
         under a doubled ":root:root" selector, which out-specifies the compiled
         :root/var() fallbacks in the Angular-injected stylesheet regardless of
         head order. Empty (zero-byte) on un-themed deploys, so every var() falls
         back to the shipped literal and the chrome renders byte-identically.
         RELATIVE href on purpose: it resolves against the base href above and
         keeps working if this document is ever served under a path prefix.
         The nginx CSP sub_filter rewrites ONLY script open-tags with the nonce;
         this stylesheet tag is left untouched — and needs no nonce, because
         style-src already includes 'self' and this is a same-origin sheet.
         NOTE: keep literal tag tokens out of this comment — the Angular index
         writer injects es-module-shims config after the first such token. -->
    <link rel="stylesheet" href="snap-theme.css" />
  </head>
  <body>
    <main app-root></main>
  </body>
</html>
