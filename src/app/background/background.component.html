<!-- Purely decorative animated backdrop. The gradient wash lives in CSS on
     :host plus its ::before/::after layers (background.component.scss); the
     single element below is the mount point for a THEME-DECLARED Vanta effect
     (--sd-bg-effect: vanta-*) and stays empty otherwise. The element is
     non-interactive, carries no semantic role and is aria-hidden, so assistive
     tech skips it; nothing here is focusable. -->
<div
  class="bg-stage"
  #stage
  aria-hidden="true"
  data-testid="background-stage"
></div>
