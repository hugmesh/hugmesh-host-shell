<!-- The banner is a THREE-TRACK row: an empty gutter, the wordmark, the chrome
     controls. The leading gutter is the controls' mirror — it is what keeps the
     wordmark on the banner's true centre instead of shoved left by the width of
     the buttons. Purely presentational and empty, so it adds nothing to the
     accessibility tree. -->
<div class="header__bar">
  <span class="header__gutter" aria-hidden="true"></span>

  <!-- REAL MARKUP, not a CSS `content:` read, for the theme's replacement text
       (--sd-header-content). The generator's own docstring offers consumers both
       shapes; only this one puts the operator's words in the accessibility tree,
       in the page's text selection and in the document outline. See
       chrome/chrome-tokens.ts. -->
  <!-- The interpolation hugs the tags: `white-space: pre-line` on the themed
       branch would otherwise render the template's own indentation as a leading
       blank line. -->
  <h1 tabindex="-1" class="text-center" [class.header__title--themed]="themedWordmark()">{{ wordmark() }}</h1>

  <!-- SHELL CHROME, top-right (operator requirement, issue #19 comment
       2026-08-19). The animation toggle, the menu toggle, the notification bell
       and the user menu all live here now — see header-controls.component.ts for
       where each came from and why the scattering was the bug. -->
  <hug-header-controls [background]="background()" />
</div>
