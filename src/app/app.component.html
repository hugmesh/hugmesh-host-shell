<a
  href="#maincontent"
  class="skip visually-hidden-focusable"
  (click)="skipToMain($event)"
>Skip to main content</a>

<app-background #bg></app-background>

<!-- SHELL CHROME LIVES IN THE BANNER (operator requirement, issue #19 comment
     2026-08-19: "the animation button, the menu toggle, the notification bell
     and user menu belong in the title at the top on the right, not in the
     menu"). The animation toggle and the menubar-mode toggle used to be
     `position: fixed` blocks right here, anchored to the BOTTOM-RIGHT corner —
     the opposite end of the page from the title, and floating over content.
     They now render inside <header personal-header>, together with the bell and
     the user menu that used to be buried in the menubar.

     The backdrop is handed DOWN rather than reached for: this template owns the
     one <app-background> instance, and passing it keeps the header free of an
     import that would drag three.js/Vanta into the always-eager banner. -->
<header personal-header [background]="bg"></header>
<div menu></div>

<!-- ACCOUNT-STATUS APPEAL-GATE: an assertive, dismissible alert shown ONLY when
     the logged-in caller's OWN status (read off GET /bff/me) is suspended/banned;
     active (or absent/fail-open) renders nothing. INFORMATIONAL — it explains the
     state + links to the appeal page, it never blocks routing. -->
<div status-gate></div>

<router-outlet></router-outlet>
<footer personal-footer></footer>

<app-profile-modal></app-profile-modal>

<hug-notification-toast />
