<a
  href="#maincontent"
  class="skip visually-hidden-focusable"
  (click)="skipToMain($event)"
>Skip to main content</a>

<app-background #bg></app-background>

<div class="bg-toggle-control">
  <button
    class="bg-toggle"
    type="button"
    data-testid="bg-toggle"
    (click)="bg.toggle()"
    [attr.aria-pressed]="bg.paused()"
    [attr.aria-label]="bg.paused() ? 'Play background animation' : 'Pause background animation'"
    aria-describedby="bg-toggle-help"
  >
    @if (bg.paused()) {
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M8 5v14l11-7z"/>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
    }
  </button>
  <!-- VISIBLE help text (palette-honoring .field-help, scalable rem text) that
       BOTH sighted and screen-reader users get: aria-describedby links it to the
       icon-only button so it is announced WITH the control, and aria-live reflects
       the current paused/playing state when it changes — never tooltip/hover-only. -->
  <span
    id="bg-toggle-help"
    class="field-help bg-toggle__help"
    data-testid="bg-toggle-help"
    aria-live="polite"
  >{{ bg.paused()
      ? 'Background animation is paused. Activate to play it again.'
      : 'Pause the moving background (helps reduce motion).' }}</span>
</div>

<header personal-header></header>
<div menu></div>

<!-- ACCOUNT-STATUS APPEAL-GATE: an assertive, dismissible alert shown ONLY when
     the logged-in caller's OWN status (read off GET /bff/me) is suspended/banned;
     active (or absent/fail-open) renders nothing. INFORMATIONAL — it explains the
     state + links to the appeal page, it never blocks routing. -->
<div status-gate></div>

<router-outlet></router-outlet>
<footer personal-footer></footer>

<app-profile-modal></app-profile-modal>
