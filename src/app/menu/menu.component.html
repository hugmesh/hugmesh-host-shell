<nav class="navbar navbar-expand-lg navbar-dark" aria-label="Main navigation">
  <button
    class="navbar-toggler"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#navbarMain"
    aria-controls="navbarMain"
    aria-expanded="false"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarMain">
    <ul class="navbar-nav" role="menubar" aria-label="Site pages">
      @for (item of items; track item.route; let i = $index) {
        <li class="nav-item" role="none">
          <button
            role="menuitem"
            class="nav-link"
            [class.disabled]="item.disabled"
            [attr.aria-disabled]="item.disabled || null"
            [attr.tabindex]="item.disabled ? -1 : 0"
            [attr.data-menu-index]="i"
            [routerLink]="item.disabled ? null : item.route"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (keydown)="onMenuKeydown($event, i)"
          >{{ item.label }}</button>
        </li>
      }
    </ul>

    <!-- Phase 10 session/role-aware federation nav. Mirrors the route guards:
         each entry is shown only when the live snap.session allows it. -->
    <ul class="navbar-nav federation-nav ms-lg-auto" aria-label="Account">
      @if (session.loggedIn()) {
        @for (item of visibleFederationItems(); track item.route) {
          <li class="nav-item" role="none">
            <a
              class="nav-link"
              [class.federation-nav__todo]="item.todo"
              [routerLink]="item.route"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [attr.data-testid]="item.testid"
            >{{ item.label }}</a>
          </li>
        }
        <li class="nav-item" role="none">
          <span class="nav-link federation-nav__user" data-testid="nav-user">
            {{ session.session()?.label }}
          </span>
        </li>
        <li class="nav-item" role="none">
          <button
            type="button"
            class="nav-link federation-nav__logout"
            data-testid="nav-logout"
            (click)="logout()"
          >Sign out</button>
        </li>
      } @else {
        <li class="nav-item" role="none">
          <a
            class="nav-link"
            routerLink="/login"
            routerLinkActive="active"
            data-testid="nav-login"
          >Sign in</a>
        </li>
      }
    </ul>
  </div>
</nav>
