server {
    listen 0.0.0.0:8080;
    listen [::]:8080;
    default_type application/octet-stream;

    gzip                    on;
    gzip_comp_level         6;
    gzip_vary               on;
    gzip_min_length         1000;
    gzip_proxied            any;
    gzip_types              text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_buffers            16 8k;
    gunzip on;
    client_max_body_size    256M;

    root /usr/share/nginx/html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + module-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection (the SPA is never framed;
    #     module federation loads remotes via <script>, not iframes, so this is safe).
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    # STRICTER policies (Content-Security-Policy, COEP/CORP, Permissions-Policy) are
    # deliberately deferred — they need per-UI tuning (federation remotes, BFF
    # connect-src, matrix camera/mic) + browser validation in the live-cluster pass.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}