# ── CSP nonce source ──────────────────────────────────────────────────────────
# nginx generates a unique $request_id per request; we reuse it as a fresh,
# unpredictable nonce that is injected into BOTH the Content-Security-Policy header
# AND every `<script` tag in index.html (see sub_filter below), so the inline /
# module-federation bootstrap scripts execute under a strict nonce-CSP without
# 'unsafe-inline'. es-module-shims 2.8.1 auto-propagates the document's script
# nonce onto the dynamic remote-entry scripts it injects.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 0.0.0.0:8080;
    listen [::]:8080;
    default_type application/octet-stream;

    gzip                    on;
    gzip_comp_level         6;
    gzip_vary               on;
    gzip_min_length         1000;
    gzip_proxied            any;
    gzip_types              text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_buffers            16 8k;
    gunzip on;
    client_max_body_size    256M;

    root /usr/share/nginx/html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + module-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection (the SPA is never framed;
    #     module federation loads remotes via <script>, not iframes). Kept DENY so it
    #     stays consistent with the CSP `frame-ancestors 'none'` directive below.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static assets must 404 when absent instead of falling through to the SPA
    # catch-all below: a missing asset that answers 200 text/html (index.html)
    # masquerades as present — e.g. a manifest fetch would "succeed" and then
    # fail JSON parsing far from the real cause. No add_header here on purpose:
    # this block inherits the server-level security headers (a location with its
    # own add_header would REPLACE them), and assets don't need the CSP.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        # Inject a fresh per-response nonce into every `<script` tag in index.html so
        # the bootstrap / es-module-shims / bundled-Bootstrap scripts run under the
        # strict nonce-CSP (no 'unsafe-inline' in script-src). sub_filter_once OFF so
        # ALL script tags get the nonce; sub_filter_types restricts rewriting to
        # text/html only — JS/CSS bundles are never touched. (Do NOT enable
        # gzip_static / precompressed index.html: sub_filter cannot rewrite a
        # pre-gzipped response body.)
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # ── Content-Security-Policy (STRONG nonce-CSP) ────────────────────────
        # script-src uses 'self' + per-response 'nonce-$cspnonce' (NO 'unsafe-inline')
        # so only nonce-tagged or same-origin scripts execute. blob: covers worker /
        # wasm script blobs. Same-origin federation remotes (prod manifest uses
        # relative /login, /social/matrix, ... paths) are covered by 'self';
        # connect-src 'self' fetches their remoteEntry.json, and connect-src https:
        # allows any cross-origin https remote / BFF / matrix homeserver (wss: for
        # Matrix sync). style-src keeps 'unsafe-inline' because the app root is the
        # ATTRIBUTE selector [app-root] and Angular emits inline component styles.
        # frame-ancestors 'none' matches X-Frame-Options DENY above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # Re-assert the other security headers here too: add_header in a nested block
        # REPLACES (does not inherit) the server-level set, so they must be repeated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        try_files $uri $uri/ /index.html =404;
    }
}