# ── CSP nonce source ──────────────────────────────────────────────────────────
# nginx generates a unique $request_id per request; we reuse it as a fresh,
# unpredictable nonce that is injected into BOTH the Content-Security-Policy header
# AND every `<script` tag in index.html (see sub_filter below), so the inline /
# module-federation bootstrap scripts execute under a strict nonce-CSP without
# 'unsafe-inline'. es-module-shims 2.8.1 auto-propagates the document's script
# nonce onto the dynamic remote-entry scripts it injects.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 0.0.0.0:8080;
    listen [::]:8080;
    default_type application/octet-stream;

    gzip                    on;
    gzip_comp_level         6;
    gzip_vary               on;
    gzip_min_length         1000;
    gzip_proxied            any;
    gzip_types              text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_buffers            16 8k;
    gunzip on;
    client_max_body_size    256M;

    root /usr/share/nginx/html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + module-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection (the SPA is never framed;
    #     module federation loads remotes via <script>, not iframes). Kept DENY so it
    #     stays consistent with the CSP `frame-ancestors 'none'` directive below.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static assets must 404 when absent instead of falling through to the SPA
    # catch-all below: a missing asset that answers 200 text/html (index.html)
    # masquerades as present — e.g. a manifest fetch would "succeed" and then
    # fail JSON parsing far from the real cause. No add_header here on purpose:
    # this block inherits the server-level security headers (a location with its
    # own add_header would REPLACE them), and assets don't need the CSP.
    location /assets/ {
        try_files $uri =404;
    }

    # Runtime theme (login-ui 50-hug-theme.sh mechanism): the entrypoint hook
    # writes $SNAP_THEME_CSS to /tmp/hug-theme.css — /tmp, NOT the docroot,
    # because uid 101 (nginx-unprivileged) cannot write /usr/share/nginx/html —
    # and this exact-match alias serves it. Exact-match wins over the `location /`
    # prefix below, so the SPA catch-all can never shadow it; an empty theme is a
    # zero-byte 200 (shipped brand), not a 404. no-store because a rebrand is an
    # env change + restart, and a cached copy would pin the old brand.
    #
    # LEGACY PATH, KEPT DELIBERATELY (RENAME PHASE 3). /hug-theme.css below is
    # now the canonical name and this image's index.html asks for that one. This
    # block stays for the two readers that can still ask for the old name: an
    # index.html baked into an image built before this commit, and a browser
    # replaying a cached document. The hook writes BOTH files byte-for-byte, so
    # the two URLs are the same bytes and neither can 404.
    #
    # RETIRE WHEN: every image in the fleet has been rebuilt from a tree
    # containing this commit AND no cached document can still reference the old
    # name. The stylesheet itself is served no-store, so it is the *documents*
    # that pin it, not the stylesheet — one release cycle (~30 days) is a
    # comfortable window. Deleting this block early costs a silently unthemed
    # page, which is the exact failure this whole migration is sequenced to
    # avoid, so err long.
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # CANONICAL PATH (RENAME PHASE 3). index.html <link>s this name, and
    # docker-entrypoint.d/50-hug-theme.sh writes it as its PRIMARY output.
    # Directives mirror the legacy block above exactly — same no-store, same
    # re-emitted security headers — because the two URLs really are the same
    # bytes under two names, and a reader must not be able to tell which one
    # they asked for from anything except the path.
    location = /hug-theme.css {
        alias /tmp/hug-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        # Inject a fresh per-response nonce into every `<script` tag in index.html so
        # the bootstrap / es-module-shims / bundled-Bootstrap scripts run under the
        # strict nonce-CSP (no 'unsafe-inline' in script-src). sub_filter_once OFF so
        # ALL script tags get the nonce; sub_filter_types restricts rewriting to
        # text/html only — JS/CSS bundles are never touched. (Do NOT enable
        # gzip_static / precompressed index.html: sub_filter cannot rewrite a
        # pre-gzipped response body.)
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # ── Content-Security-Policy (STRONG nonce-CSP) ────────────────────────
        # script-src uses 'self' + per-response 'nonce-$cspnonce' (NO 'unsafe-inline')
        # so only nonce-tagged or same-origin scripts execute. blob: covers worker /
        # wasm script blobs. Same-origin federation remotes (prod manifest uses
        # relative /login, /social/matrix, ... paths) are covered by 'self';
        # connect-src 'self' fetches their remoteEntry.json, and connect-src https:
        # allows any cross-origin https remote / BFF / matrix homeserver (wss: for
        # Matrix sync). style-src keeps 'unsafe-inline' because the app root is the
        # ATTRIBUTE selector [app-root] and Angular emits inline component styles.
        # frame-ancestors 'none' matches X-Frame-Options DENY above.
        #
        # 'wasm-unsafe-eval' is REQUIRED and belongs HERE, not only on the remote.
        # A federated remote does not get to set the policy it runs under: the
        # DOCUMENT is this shell, so this header governs every remote mounted into
        # it and the remote's own nginx CSP never applies to shell-hosted code.
        # hugmesh-character-forge-bff-api runs a Godot 4.7 web export, and without
        # this token WebAssembly.instantiate/instantiateStreaming is blocked
        # outright by script-src — the engine cannot boot, the 3D preview never
        # appears, and (because the failure is a CSP violation rather than a
        # request error) there is nothing in the network log to find it by.
        # 'wasm-unsafe-eval' permits WebAssembly compilation ONLY; it does not
        # re-enable eval() or inline script, so the nonce-CSP above is otherwise
        # intact — this is strictly narrower than the 'unsafe-eval' it replaces the
        # need for.
        #
        # media-src 'self' blob: — the same export decodes audio through blob URLs,
        # which would otherwise fall back to default-src 'self' and be refused.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob: 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # Re-assert the other security headers here too: add_header in a nested block
        # REPLACES (does not inherit) the server-level set, so they must be repeated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        try_files $uri $uri/ /index.html =404;
    }
}