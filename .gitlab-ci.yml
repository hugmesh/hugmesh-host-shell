# Snapdragon CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Pull in the centralized OWASP pen-test stage (SCA Dependency-Check + ZAP DAST
# baseline) as the single source of truth. The hidden `.pentest-*` jobs live in
# the generator repo; the thin `pentest:*` jobs below `extends:` them so the full
# harness (probes + nuclei) runs without duplicating any script here.
include:
  - project: 'Snapdragon-Systems/snapdragon-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [build, pentest]

build:image:
  stage: build
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# -----------------------------------------------------------------------------
# OWASP pen-test stage (centralized; see include: above).
#
# Thin jobs that `extends:` the hidden `.pentest-*` jobs from the generator's
# pentest-stage template — one source of truth, so the full harness (custom
# probes + nuclei + ZAP) runs here too. allow_failure: true keeps findings
# non-blocking for the image build/deploy; rules mirror the security posture
# (default branch + merge requests).
# -----------------------------------------------------------------------------
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
