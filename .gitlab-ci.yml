# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Pull in the centralized OWASP pen-test stage (SCA Dependency-Check + ZAP DAST
# baseline) as the single source of truth. The hidden `.pentest-*` jobs live in
# the generator repo; the thin `pentest:*` jobs below `extends:` them so the full
# harness (probes + nuclei) runs without duplicating any script here.
include:
  - project: 'hugmesh/snapdragon-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, build, pentest]

# -----------------------------------------------------------------------------
# Host-shell e2e (Nightwatch 3 + Cucumber, e2e/features + e2e/step_definitions).
# Runs the LOCAL subset only: nightwatch.conf.js filters `not @skip and not
# @cluster` (the platform-wide live-stack-only tag convention — this repo
# previously used @integration; the tag was renamed, semantics unchanged), so
# the @cluster scenarios (which need the federation
# remotes served from their own dev servers / the integrated env) stay dark
# here exactly as they do in `npm run e2e` — they are compile-checked by the
# cucumber require pass but never executed. The shell runner has docker (not
# node/chrome), so the whole run happens inside a disposable node container,
# matching the build:image job's docker-CLI structure: install a current Chrome
# + a MATCHING chromedriver (DETECT_CHROMEDRIVER_VERSION resolves the driver
# against the installed browser at npm-install time), build the prod bundle,
# serve it with the repo's server.js on :8080 (the nightwatch launch_url), and
# run the headless chrome env.
# -----------------------------------------------------------------------------
e2e:host:
  stage: test
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - >
      docker run --rm --shm-size=2g -v "$PWD:/work" -w /work node:lts bash -c '
      set -euo pipefail;
      apt-get update -qq && apt-get install -y -qq --no-install-recommends wget ca-certificates procps >/dev/null;
      wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb;
      apt-get install -y -qq /tmp/chrome.deb >/dev/null;
      DETECT_CHROMEDRIVER_VERSION=true npm ci --no-audit --no-fund;
      npm run build;
      node server.js & SERVER_PID=$!;
      for i in $(seq 1 30); do wget -qO /dev/null http://localhost:8080/ && break || sleep 1; done;
      npm run e2e;
      kill "$SERVER_PID"'
  after_script:
    # The container ran as root over the mounted workspace — hand the generated
    # output (node_modules, public, reports) back to the runner user so the next
    # checkout can clean it.
    - docker run --rm -v "$PWD:/work" -w /work node:lts chown -R "$(id -u):$(id -g)" .
  artifacts:
    when: always
    paths:
      # nightwatch output_folder + the cucumber html/json/junit reports.
      - integration-tests-report/
      # the repo's custom handlebars html reporter writes under e2e/.
      - e2e/integration-tests-report/
    expire_in: 1 week

build:image:
  stage: build
  tags: [snapdragon-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# -----------------------------------------------------------------------------
# OWASP pen-test stage (centralized; see include: above).
#
# Thin jobs that `extends:` the hidden `.pentest-*` jobs from the generator's
# pentest-stage template — one source of truth, so the full harness (custom
# probes + nuclei + ZAP) runs here too. allow_failure: true keeps findings
# non-blocking for the image build/deploy; rules mirror the security posture
# (default branch + merge requests).
# -----------------------------------------------------------------------------
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
