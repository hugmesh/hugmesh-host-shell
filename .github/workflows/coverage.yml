# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Code Coverage
permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main", "release/*"]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Theme-token contract gate
        run: npm run-script check:theme-tokens
      - name: npm install and coverage
        run: |
          npm install
          npm run-script coverage
      # A production build is the ONLY thing that catches a stale
      # overrides.@softarc/native-federation pin -- see _overridesNote in
      # package.json. The unit suite goes green on a broken bundle, which is
      # how the 22.1.1 bump landed with an unbuildable production tree.
      - name: Production build
        run: npm run-script build
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.18.0
        if: always()
        with:
          files: |
            coverage/hugmesh/**/test-results.xml