# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Code Coverage
permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: ["main", "release/*"]
  pull_request:
    branches: ["main", "release/*"]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # WITHOUT THIS STEP THE MATRIX IS DECORATION. `node-version: [24.x]` was
      # declared above and never installed, so the job ran on whatever node the
      # runner image happened to preinstall and the matrix value only ever
      # reached the job NAME, "build_and_test (24.x)". That is not cosmetic:
      # the runner's preinstalled npm was BELOW 11.3.0, and such an npm CANNOT
      # read this repo's lockfile (see the npm ci step below). The exact version
      # is NOT recoverable and this comment previously overstated it as "a 10.x":
      # the failing run (33928197351) predates the Record toolchain step below so
      # it printed none, and the failure signature ("Missing: semver@7.5.2 /
      # lru-cache@6.0.0 / yallist@4.0.0 from lock file") is IDENTICAL across npm
      # 9.9.4, 10.8.2, 10.9.4 and 11.0.0. Measured against the committed
      # package-lock.json, `npm ci --dry-run`:
      #     npm  9.9.4  exit 1     npm 11.0.0  exit 1
      #     npm 10.8.2  exit 1     npm 11.3.0  exit 0
      #     npm 10.9.4  exit 1     npm 11.6.2 / 11.12.0 / 11.16.0 / 11.19.0  exit 0
      # Every node 24.x ships an npm at or above the passing bound (24.0.0 ->
      # npm 11.3.0, 24.20.0 -> npm 11.19.0), so pinning the matrix for real is
      # what makes the step below viable across the whole 24.x line.
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Recorded on every run so the versions this job actually used are never
      # again a matter of inference.
      - name: Record toolchain
        run: node -v && npm -v
      - name: Theme-token contract gate
        run: npm run-script check:theme-tokens
      # `npm ci`, NOT `npm install`: this job must test the tree the merge
      # actually produces, not a fresh re-resolve of it.
      # (An earlier revision of this comment justified that with "this job is the
      # only automated gate on a dependency bump". That is FALSE and is corrected
      # here: .gitlab-ci.yml also runs e2e:host -- npm ci + build + nightwatch --
      # and build:image, both on merge requests and the default branch, via the
      # in-cluster GitLab pull mirror. This is the only gate that runs on GITHUB,
      # which is where Dependabot opens its PRs.)
      # MEASURED on this repo (npm 11.19.0), package.json pinned to
      # @types/node 26.2.0 against a lockfile holding 26.4.0:
      #   npm install  -> exit 0, and it SILENTLY REWRITES package-lock.json to
      #                   match package.json. CI goes green on a lockfile that
      #                   is not the committed one and says nothing.
      #   npm ci       -> exit 1, EUSAGE, "lock file's @types/node@26.4.0 does
      #                   not satisfy @types/node@26.2.0" -- names the package.
      # MEASURED LIMIT, so this line is not credited with more than it does: on
      # an already-in-sync tree `npm install` did NOT drift within a caret range
      # (^26.4.0 stayed 26.4.0 with 26.4.1 published), and it rewrote nothing.
      # The failure this closes is a package.json/package-lock.json DESYNC being
      # papered over, not silent version drift.
      #
      # THIS STEP REQUIRES npm >= 11.3.0, which is why the setup-node step above
      # is not optional. The nested override
      #   overrides["cucumber-html-reporter"]["@cucumber/cucumber"]["semver"]
      # is placed differently by npm 10 and npm 11: npm 10 builds an ideal tree
      # wanting semver@7.5.2 / lru-cache@6.0.0 / yallist@4.0.0 at a second path
      # the lockfile does not record, and aborts with "Missing: ... from lock
      # file". `npm install` never noticed because it simply re-resolves. The
      # first push of this change proved it live: with no setup-node step the
      # job failed here on the runner's preinstalled npm, with that exact
      # signature. (What the run artifacts prove is npm < 11.3.0, not a specific
      # 10.x -- see the setup-node comment above.)
      - name: npm ci and coverage
        run: |
          npm ci
          npm run-script coverage
      # Fires at the bump that INTRODUCES override drift. npm applies
      # `overrides` without resolution, so a pin that contradicts what
      # @angular-architects/native-federation requires installs with exit 0 and
      # no ERESOLVE -- and, measured on this repo, also passes the unit suite
      # AND the production build below. See scripts/check-nf-override.mjs.
      - name: Override contract gate
        run: npm run-script check:nf-override
      # MEASURED REACH of this step, so nobody mistakes it for the override gate:
      # it catches a pin stale enough to break the @softarc/native-federation
      # /internal export surface -- override 4.3.2 under @angular-architects
      # 22.1.x fails here with "does not provide an export named 'isUnderAnyDir'",
      # no bundle emitted. It does NOT catch one minor of drift: override 4.4.1
      # under 22.1.2 (which requires ~4.5.0) exits 0 here, on the committed
      # lockfile and on a full fresh re-resolve alike. That case is the
      # Override contract gate's job, not this one.
      # What this step IS for: before it was added, the job named build_and_test
      # ran no build at all -- only check:theme-tokens and ng test.
      - name: Production build
        run: npm run-script build
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.18.0
        if: always()
        with:
          files: |
            coverage/hugmesh/**/test-results.xml