name: Unit Tests

# Headless Karma/Jasmine unit tests for the native-federation host shell.
# This is the org-wide template for the Angular hygiene pass: every new
# component/guard/service ships meaningful specs, and CI runs them on Chrome
# headless via the ChromeHeadlessCI launcher already defined in karma.conf.js.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Chrome (for ChromeHeadlessCI)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (headless + coverage)
        run: npm run coverage
        env:
          # browser-actions/setup-chrome exports CHROME_BIN; karma's
          # ChromeHeadlessCI launcher (--no-sandbox --disable-dev-shm-usage) uses it.
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/snapdragon/
          if-no-files-found: ignore
