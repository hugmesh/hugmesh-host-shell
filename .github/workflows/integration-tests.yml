name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-build
          path: public/snapdragon.systems/browser/
          retention-days: 1

  integration-tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-build
          path: public/snapdragon.systems/browser/

      - name: Start app server
        run: |
          node server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ && break
            sleep 1
          done

      - name: Run integration tests
        run: npm run e2e:test

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: integration-tests-report/
          retention-days: 14

      - name: Generate summary
        if: always()
        env:
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node generate-summary.js

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: integration-tests
          path: integration-tests-report/pr-comment.md

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2.18.0
        with:
          files: integration-tests-report/cucumber-junit.xml
          check_name: Integration Test Results
          comment_title: Integration Test Results
