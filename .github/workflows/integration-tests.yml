name: Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-build
          path: public/snapdragon.systems/browser/
          retention-days: 1

  integration-tests:
    needs: build
    runs-on: ubuntu-latest
    # Cap the job: Nightwatch was hanging until the 6h default when the browser
    # never came up. Fail fast instead.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-build
          path: public/snapdragon.systems/browser/

      - name: Start nginx server
        run: |
          docker run -d --name e2e-nginx \
            -p 8081:8080 \
            -v ${{ github.workspace }}/public/snapdragon.systems/browser:/usr/share/nginx/html:ro \
            -v ${{ github.workspace }}/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginxinc/nginx-unprivileged

      - name: Wait for nginx
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/ && break || sleep 1
          done

      # The runner ships no browser matched to the pinned chromedriver, so
      # Nightwatch hung waiting for a webdriver. Install a matched Chrome +
      # chromedriver pair and point Nightwatch at them (see nightwatch.conf.js).
      - name: Set up matched Chrome + chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run integration tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: ./node_modules/.bin/nightwatch --env nginx --config ./nightwatch.conf.js

      - name: Stop nginx
        if: always()
        run: docker stop e2e-nginx || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: integration-tests-report/
          retention-days: 14

      - name: Generate summary
        if: always()
        env:
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node generate-summary.js

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: integration-tests
          path: integration-tests-report/pr-comment.md

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2.18.0
        with:
          files: integration-tests-report/cucumber-junit.xml
          check_name: Integration Test Results
          comment_title: Integration Test Results
